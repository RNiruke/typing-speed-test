<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Activated</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f7f9ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 50px 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; max-width: 420px; }
        .icon { font-size: 60px; margin-bottom: 16px; }
        h2 { color: #2ecc71; margin-bottom: 10px; }
        p  { color: #636e72; line-height: 1.7; }
        .btn { display: inline-block; margin-top: 24px; background: #4a6cf7; color: white; padding: 12px 32px; border-radius: 8px; text-decoration: none; font-weight: 600; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">✅</div>
        <h2>Account Activated!</h2>
        <p>Your email has been verified successfully.<br>You can now log in to your account.</p>
        <a href="{% url 'login' %}" class="btn">Go to Login</a>
    </div>
</body>
</html>
