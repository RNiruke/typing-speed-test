<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login - Typing Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #e3ecff, #f7f9ff); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #4a6cf7; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; background-color: #4a6cf7; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn:hover { background-color: #364fc7; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-bottom: 10px; }
        .switch-link { margin-top: 20px; font-size: 14px; color: #636e72; }
        .switch-link a { color: #4a6cf7; text-decoration: none; font-weight: 600; }
        .options {display: flex;justify-content: space-between;align-items: center;margin-top: 8px;font-size: 14px;}
        /* Modal Background */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

/* Modal Box */
.modal-content {
    background: #2c2f36;
    margin: 10% auto;
    padding: 30px;
    width: 350px;
    border-radius: 12px;
    text-align: center;
    color: white;
}

/* Input */
.modal-content input {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 8px;
    border: 2px solid #ffc107;
    background: transparent;
    color: white;
}

/* Button */
.modal-content button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    background: #4a6cf7;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* Close Button */
.close {
    position: absolute;
    top: 15px;
    right: 25px;
    font-size: 25px;
    cursor: pointer;
}

.options label {
    color: #555;
}

.forgot-link {
    color: #aaa;text-decoration: none;transition: 0.3s;}

.forgot-link:hover {color: #4a6cf7;}
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #16a34a;
    color: white;
    padding: 18px 22px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    display: none;
    z-index: 9999;
    width: 300px;
    animation: slideIn 0.4s ease;
}

.toast-title {
    font-weight: 600;
    margin-bottom: 5px;
}

@keyframes slideIn {
    from {
        transform: translateX(100%);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Welcome Back</h2>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <div class="options">

   <a href="#" onclick="openModal()" class="forgot-link">
    forgot password?
   </a>
   </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="switch-link">
            Don't have an account? <a href="{% url 'signup' %}">Sign Up</a>
        </div>
    </div>

    <!-- Forgot Password Modal -->
<div id="forgotModal" class="modal">
    <div class="modal-content">
        <h2>Forgot Password</h2>

        <form id="forgotForm" action="{% url 'forgot_password' %}">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Enter your email" required>

            <button type="submit">Send Reset Link</button>
        </form>

        <span class="close" onclick="closeModal()">&times;</span>
    </div>
</div>

<script>
function openModal() {
    document.getElementById("forgotModal").style.display = "block";
}

function closeModal() {
    document.getElementById("forgotModal").style.display = "none";
}

// Close when clicking outside
window.onclick = function(event) {
    let modal = document.getElementById("forgotModal");
    if (event.target == modal) {
        modal.style.display = "none";
    }
}
document.getElementById("forgotForm").addEventListener("submit", function(e) {
    e.preventDefault(); // 🔥 stop page reload

    let email = this.email.value;

    fetch("{% url 'forgot_password' %}", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            "X-CSRFToken": "{{ csrf_token }}"
        },
        body: `email=${email}`
    })
    .then(res => res.json())
    .then(data => {});
    showToast();
});

function showToast() {
    let toast = document.getElementById("toast");

    toast.style.display = "block";

    setTimeout(() => {
        toast.style.display = "none";
    }, 5000);
}


</script>
<div id="toast" class="toast">
    <div class="toast-title">✔ Successful</div>
    <div>Password reset request received. Check your email.</div>
</div>
</body>
</html>
