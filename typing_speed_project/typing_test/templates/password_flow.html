<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e3ecff, #f7f9ff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .box h2 {
            color: #4a6cf7;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .box p.subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .box input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border 0.2s;
        }

        .box input:focus {
            border-color: #4a6cf7;
        }

        .box button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            background: #4a6cf7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: background 0.3s;
        }

        .box button:hover {
            background: #364fc7;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            font-size: 13px;
            color: #4a6cf7;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        /* Lock icon */
        .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

{% if step == "reset" %}

    <div class="box">
        <div class="icon">🔒</div>
        <h2>Set New Password</h2>
        <p class="subtitle">Enter and confirm your new password below.</p>

        <form method="POST">
            {% csrf_token %}
            <input type="password" name="password" placeholder="New Password" required>
            <input type="password" name="confirm_password" placeholder="Confirm Password" required>
            <button type="submit">Change Password</button>

            {% if error %}
                <p class="error-msg">{{ error }}</p>
            {% endif %}
        </form>

        <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    </div>

{% endif %}

</body>
</html>
