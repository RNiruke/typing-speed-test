<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify Your Email</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f7f9ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 50px 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); text-align: center; max-width: 460px; }
        .icon { font-size: 60px; margin-bottom: 16px; }
        h2 { color: #2d3436; margin-bottom: 10px; }
        p  { color: #636e72; line-height: 1.7; margin-bottom: 6px; }
        .email { font-weight: 600; color: #4a6cf7; }
        .note  { font-size: 13px; color: #b2bec3; margin-top: 20px; }
        a { color: #4a6cf7; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">📧</div>
        <h2>Check Your Email</h2>
        <p>We've sent an activation link to:</p>
        <p class="email">{{ email }}</p>
        <p>Click the link in the email to activate your account.</p>
        <p class="note">Didn't receive it? Check your spam folder.<br>
        Already activated? <a href="{% url 'login' %}">Login here</a></p>
    </div>
</body>
</html>
